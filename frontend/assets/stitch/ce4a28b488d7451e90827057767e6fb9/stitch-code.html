<!-- Shared Component: TopAppBar -->
<header class="w-full bg-background z-50">
<div class="flex justify-between items-center max-w-[900px] mx-auto px-6 h-20">
<!-- Brand Logo -->
<a class="font-headline-lg text-headline-lg italic text-on-background tracking-tight" href="#">
        Contos de Ninar
      </a>
<!-- Navigation Links (Hidden on small mobile, visible md+) -->
<nav class="hidden md:flex items-center space-x-md">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-70" href="#">

<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-70" href="#">

<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-70" href="#">
          Favoritas
        </a>
<!-- Active Link -->
<a aria-current="page" class="font-label-md text-label-md text-primary border-b-2 border-primary pb-1 cursor-pointer active:opacity-70" href="#">
          Configurações
        </a>
</nav>
<!-- Trailing Action -->
<button aria-label="Profile" class="text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-70 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-[900px] mx-auto px-6 py-lg pb-xl">
<header class="mb-xl">
<h1 class="font-headline-xl text-headline-xl text-on-background">Configurações 2</h1>
</header>
<div class="space-y-xl">
<!-- Section 1: Narração -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-md">Narração</h2>
<div class="bg-surface rounded-2xl p-md md:p-lg border border-outline-variant space-y-xl">
<!-- Voz padrão -->
<div class="max-w-md">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="voice-select">Voz padrão</label>
<div class="relative group">
<select class="w-full bg-transparent border-b border-outline py-sm px-0 text-on-background font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-0 appearance-none cursor-pointer transition-colors group-hover:border-primary" id="voice-select">
<option value="fem-suave">Feminina Suave</option>
<option value="masc-suave">Masculina Suave</option>
<option value="fem-animada">Feminina Animada</option>
<option value="masc-animado">Masculino Animado</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-hover:text-primary transition-colors">expand_more</span>
</div>
</div>
<!-- Velocidade padrão -->
<div class="max-w-md">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base">Velocidade padrão</label>
<div class="flex p-xs bg-surface-variant rounded-lg border border-outline-variant">
<button class="flex-1 py-sm px-xs rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-background hover:bg-surface/50 transition-all cursor-pointer">
                Lenta
              </button>
<button class="flex-1 py-sm px-xs rounded-md bg-surface shadow-sm border border-outline-variant/50 font-label-md text-label-md text-on-background cursor-default">
                Normal
              </button>
<button class="flex-1 py-sm px-xs rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-background hover:bg-surface/50 transition-all cursor-pointer">
                Rápida
              </button>
</div>
</div>
</div>
</section>
<!-- Section 3: Sobre -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-md">Sobre</h2>
<div class="bg-surface rounded-2xl p-md md:p-lg border border-outline-variant flex flex-col space-y-sm">
<p class="font-label-md text-label-md text-on-background">
            Contos de Ninar · v0.1.0
          </p>
<p class="font-body-md text-body-md text-on-surface-variant max-w-2xl leading-relaxed">
            Suas histórias ficam salvas neste dispositivo e não são enviadas para nenhum servidor. 
            Priorizamos a privacidade e um ambiente digital sereno para sua família.
          </p>
</div>
</section>
